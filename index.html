<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta charset="UTF-8">
  <link rel="manifest" href="manifest.json">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Setlist">
	<link rel="apple-touch-icon" href="icon-192.png">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Ukuelectics BayShire Gig 🎵🎶</title>
  <style>
    :root{
      --sidebar-w: 280px;
      --accent: #2b7a78;
      --muted: #666;
      --bg: #f6f7f8;
      --card: #fff;
    }
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{display:flex;flex-direction:column;background:var(--bg);color:#111;}
    header{padding:16px 20px;background:linear-gradient(90deg,#eaf8f7,#ffffff);box-shadow:0 1px 0 rgba(0,0,0,0.04);font-size:20px;font-weight:700;display:flex;align-items:center;}
    main{flex:1;display:flex;min-height:0;}
    .sidebar{width:var(--sidebar-w);background:var(--card);padding:12px;border-right:1px solid rgba(0,0,0,0.06);overflow:auto;}
    .song{padding:10px 8px;border-radius:6px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
    .song:hover{background:#f0f8f7;}
    .song.active{background:linear-gradient(90deg,rgba(43,122,120,0.12),rgba(43,122,120,0.04));border-left:4px solid var(--accent);padding-left:6px;}
    .song .title{font-weight:600;}
    .song .bpm{color:var(--muted);font-size:13px;margin-left:8px;}
    .viewer{flex:1;display:flex;flex-direction:column;align-items:stretch;min-width:0;}
    .pdf-wrap{flex:1;background:var(--card);margin:12px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;}
    /* center container that scales the iframe to 80% */
    .pdf-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#ddd;}
    .pdf-frame{width:80%;height:90%;border:0;transform-origin:top left;}
    footer{padding:10px 14px;background:#fff;border-top:1px solid rgba(0,0,0,0.06);display:flex;flex-direction:column;gap:8px;}
    .controls{display:flex;align-items:center;gap:12px;}
    .controls button{padding:8px 12px;border-radius:6px;border:1px solid rgba(0,0,0,0.08);background:#fff;cursor:pointer;}
    .controls button:active{transform:translateY(1px);}
    .progress{flex:1;display:flex;align-items:center;gap:8px;}
    .progress input[type="range"]{width:100%;}
    .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);}
    .youtube-link{font-size:13px;color:#0b66c3;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%;}
    .small{font-size:12px;color:var(--muted);}
    @media (max-width:900px){
      .sidebar{display:none;}
      header{font-size:18px;}
      .pdf-frame{width:95%;}
    }
  </style>
</head>
<body>
  <header>Ukuelectics BayShire Gig 🎵🎶</header>

  <main>
    <aside class="sidebar" id="songList" aria-label="Song list"></aside>

    <section class="viewer">
      <div class="pdf-wrap" id="pdfWrap" aria-live="polite">
        <div class="pdf-inner">
          <!-- PDF displayed at 80% width of the viewer; toolbar hidden via URL fragment -->
          <iframe id="pdfFrame" class="pdf-frame" src="" title="Sheet music PDF" ></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="controls">
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="rewindBtn" title="Rewind to start">⏮️ Rewind</button>
        <button id="playBtn" title="Play">▶️ Play</button>
        <button id="stopBtn" title="Stop">⏹️ Stop</button>
      </div>

      <div class="progress" aria-hidden="false">
        <span class="small" id="timeCurrent">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" aria-label="Seek">
        <span class="small" id="timeTotal">0:00</span>
      </div>
    </div>

    <div class="meta">
      <div>
        <span class="small">Now playing:</span>
        <strong id="nowPlaying">—</strong>
      </div>
      <div>
        <a id="youtubeLink" class="youtube-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>
  </footer>

  <script>
    // Song list (keeps the same order as the table)
    const songs = [
      { name: "Bring Me Sunshine", youtube: "https://www.youtube.com/watch?v=Dnahzdotjiw", bpm: 81, resource: "bring-me-sunshine" },
      { name: "Fly Me To The Moon", youtube: "https://www.youtube.com/watch?v=JYuyWrkwpok", bpm: 119, resource: "fly-me-to-the-moon" },
      { name: "Hit The Road Jack", youtube: "https://www.youtube.com/watch?v=uSiHqxgE2d0", bpm: 173, resource: "hit-the-road-jack" },
      { name: "Stand By Me", youtube: "https://www.youtube.com/watch?v=hwZNL7QVJjE", bpm: 119, resource: "stand-by-me" },
      { name: "L-O-V-E", youtube: "https://www.youtube.com/watch?v=f_HmF84G7ZY", bpm: 78, resource: "love" },
      { name: "Will You Still Love Me Tomorrow", youtube: "https://www.youtube.com/watch?v=Dfmn9M6hXVI", bpm: 178, resource: "will-you-still-love-me-tomorrow" },
      { name: "Something Stupid", youtube: "https://www.youtube.com/watch?v=Y_t2gNCXYbY", bpm: 104, resource: "something-stupid" },
	{ name: "Walking After Midnight", youtube: "https://www.youtube.com/watch?v=bsRNCvHXHHU", bpm: 104, resource: "walking-after-midnight" }
     
  ];

    // Elements
    const songListEl = document.getElementById('songList');
    const pdfFrame = document.getElementById('pdfFrame');
    const nowPlayingEl = document.getElementById('nowPlaying');
    const youtubeLinkEl = document.getElementById('youtubeLink');

    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const rewindBtn = document.getElementById('rewindBtn');
    const seek = document.getElementById('seek');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');

    // Audio element
    const audio = new Audio();
    audio.preload = 'auto';

    let currentIndex = null;
    let isSeeking = false;

    function formatTime(sec){
      if (!isFinite(sec)) return '0:00';
      const s = Math.floor(sec % 60).toString().padStart(2,'0');
      const m = Math.floor(sec / 60);
      return `${m}:${s}`;
    }

    // Build song list UI
    songs.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'song';
      el.tabIndex = 0;
      el.innerHTML = `<div><span class="title">${s.name}</span> <span class="bpm">(${s.bpm})</span></div>`;
      el.addEventListener('click', () => selectSong(i));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectSong(i); }});
      songListEl.appendChild(el);
    });

    // Select and load a song
    function selectSong(index){
      if (index < 0 || index >= songs.length) return;
      const s = songs[index];
      currentIndex = index;

      // highlight
      document.querySelectorAll('.song').forEach((el, i) => el.classList.toggle('active', i === index));

      // Use relative paths (no leading slash) to avoid local-resource issues when served
      const pdfPath = `resources/${s.resource}.pdf#toolbar=0&navpanes=0&view=FitH&zoom=80`;
      const audioPath = `resources/${s.resource}.mp3`;

      // Load PDF and audio
      pdfFrame.src = pdfPath;
      audio.src = audioPath;
      audio.currentTime = 0;

      nowPlayingEl.textContent = `${s.name} (${s.bpm})`;
      youtubeLinkEl.textContent = s.youtube;
      youtubeLinkEl.href = s.youtube;

      // Try to play (may be blocked until user interacts)
      audio.play().catch(() => {
        // autoplay blocked — UI remains ready for user to press Play
      });
    }

    // Audio events
    audio.addEventListener('loadedmetadata', () => {
      seek.max = Math.floor(audio.duration);
      timeTotal.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      if (!isSeeking) {
        seek.value = Math.floor(audio.currentTime);
        timeCurrent.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('play', () => { playBtn.textContent = '⏸️ Pause'; });
    audio.addEventListener('pause', () => { playBtn.textContent = '▶️ Play'; });
    audio.addEventListener('ended', () => { playBtn.textContent = '▶️ Play'; });

    // Controls
    playBtn.addEventListener('click', () => {
      if (!audio.src) {
        selectSong(0);
        return;
      }
      if (audio.paused) audio.play().catch(()=>{});
      else audio.pause();
    });

    stopBtn.addEventListener('click', () => {
      audio.pause();
      audio.currentTime = 0;
      seek.value = 0;
      timeCurrent.textContent = formatTime(0);
    });

    rewindBtn.addEventListener('click', () => {
      audio.currentTime = 0;
      if (!audio.paused) audio.play().catch(()=>{});
    });

    // Seek slider
    seek.addEventListener('input', () => {
      isSeeking = true;
      timeCurrent.textContent = formatTime(seek.value);
    });
    seek.addEventListener('change', () => {
      audio.currentTime = seek.value;
      isSeeking = false;
      if (audio.paused) {
        // keep paused; user can press play
      } else {
        audio.play().catch(()=>{});
      }
    });

    // Keyboard shortcuts (space toggles play/pause; left/right seek)
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.isContentEditable) return;
      if (e.key === ' ') {
        e.preventDefault();
        if (!audio.src) selectSong(0);
        if (audio.paused) audio.play().catch(()=>{});
        else audio.pause();
      } else if (e.key === 'ArrowRight') {
        audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
      } else if (e.key === 'ArrowLeft') {
        audio.currentTime = Math.max(0, audio.currentTime - 5);
      } else if (e.key === 'n') {
        const next = (currentIndex === null ? 0 : Math.min(songs.length - 1, currentIndex + 1));
        selectSong(next);
      } else if (e.key === 'p') {
        const prev = (currentIndex === null ? 0 : Math.max(0, currentIndex - 1));
        selectSong(prev);
      }
    });

    // Load first song without autoplay (safer for browsers)
    selectSong(0);
  </script>
</body>
</html>
